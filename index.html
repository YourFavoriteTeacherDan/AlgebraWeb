    <!-- Obfuscated Auto-Cloak -->
    <script>
        (function(){
            const c = window.location.protocol;
            if(c !== atob('YWJvdXQ6') && window.self === window.top) {
                let w = window.open(atob('YWJvdXQ6Ymxhbms='), '_blank');
                if(w) {
                    w.document.write('<!DOCTYPE html>' + document.documentElement.outerHTML);
                    w.document.close();
                    window.location.replace(atob('aHR0cHM6Ly9jbGFzc3Jvb20uZ29vZ2xlLmNvbQ=='));

    <style>
        :root {
            --bg-main: #18191a; --bg-sidebar: #212325; --bg-console: #161718;
            --text-main: #e8eaed; --text-muted: #9aa0a6; --accent: #7e9ef2;
            --border: rgba(255, 255, 255, 0.08); --danger: #fc6060; --success: #67c780; --warning: #fbbc05;
            --btn-radius: 8px; --transition-speed: 0.2s;
        }

        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-main); color: var(--text-main);
            height: 100vh; overflow: hidden;
        }

        /* --- DECOY UI --- */
        #decoy-ui {
            width: 100vw; height: 100vh; background: #ffffff;
            display: flex; flex-direction: column; z-index: 999999;
        }
        #decoy-header {
            background: #f1f3f4; padding: 12px 24px; border-bottom: 1px solid #dadce0;
            color: #202124; font-size: 18px; font-family: Arial, sans-serif; font-weight: bold;
        }
        #decoy-textarea {
            flex: 1; border: none; padding: 40px; font-size: 16px; font-family: 'Courier New', Courier, monospace;
            resize: none; outline: none; background: #ffffff; color: #202124; line-height: 1.6;
        }

        /* --- REAL UI --- */
        #real-ui { display: none; width: 100vw; height: 100vh; }

        /* --- Boss Key Layer --- */
        #boss-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #fff; color: #202124; z-index: 9999999; display: none;
            flex-direction: column; align-items: center; font-family: Arial, sans-serif;
        }
        #boss-top-nav { display: flex; justify-content: flex-end; padding: 15px 20px; gap: 15px; align-items: center; width: 100%; box-sizing: border-box; font-size: 13px; }
        #boss-top-nav a { color: #5f6368; text-decoration: none; }
        .profile-pic { width: 32px; height: 32px; background: #673ab7; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .google-logo { font-size: 88px; font-weight: bold; letter-spacing: -3px; margin-top: 10vh; margin-bottom: 25px; }
        .g-blue { color: #4285f4; } .g-red { color: #ea4335; } .g-yellow { color: #fbbc05; } .g-green { color: #34a853; }
        .search-container { display: flex; align-items: center; width: 580px; max-width: 90vw; height: 46px; border: 1px solid #dfe1e5; border-radius: 24px; padding: 0 14px; box-sizing: border-box; }
        .search-container input { flex: 1; border: none; outline: none; font-size: 16px; padding: 0 10px; }
        .boss-buttons { display: flex; gap: 12px; margin-top: 25px; }
        .boss-buttons button { background: #f8f9fa; border: 1px solid #f8f9fa; padding: 0 16px; height: 36px; border-radius: 4px; color: #3c4043; cursor: pointer; }

        /* --- Sidebar UI --- */
        #sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; box-sizing: border-box; z-index: 10; }
        #sidebar.hidden { display: none; }
        .sidebar-header { padding: 18px; border-bottom: 1px solid var(--border); }
        .sidebar-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sidebar-title-row h2 { margin: 0; font-size: 1.25rem; color: var(--accent); font-weight: 600; }
        
        .key-input { width: 100%; padding: 10px; border-radius: var(--btn-radius); border: 1px solid var(--border); background: var(--bg-console); color: white; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        
        .btn { border: 1px solid var(--border); color: #18191a; background-color: var(--accent); padding: 9px 12px; border-radius: var(--btn-radius); font-size: 0.85rem; font-weight: 600; width: 100%; cursor: pointer; box-sizing: border-box; text-align: center; margin-bottom: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-secondary { background-color: #383b3e; color: white; border: 1px solid #484b4e; }
        .btn-green { background-color: var(--success); }
        .btn-turbo { background-color: var(--warning); color: #000; border: none; display: none; }
        .btn-turbo:hover { filter: brightness(1.1); }

        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        #upload-status { font-size: 0.8rem; color: var(--success); margin-bottom: 8px; font-weight: bold; text-align: center; }

        #file-tree { flex: 1; overflow-y: auto; padding: 12px; list-style: none; margin: 0; }
        .folder-group { margin-bottom: 15px; }
        .folder-title { font-size: 0.85rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); margin-bottom: 8px; }
        
        .file-item { padding: 8px 12px; border-radius: var(--btn-radius); cursor: pointer; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .file-item:hover { background: rgba(255, 255, 255, 0.05); }
        .file-item.active { background: rgba(126, 158, 242, 0.15); color: var(--accent); border-color: var(--accent); }
        .action-btns { display: none; gap: 4px; }
        .action-btns button { background: none; border: none; cursor: pointer; color: var(--text-muted); }
        .delete-btn:hover { color: var(--danger); }
        .file-item:hover .action-btns { display: flex; }

        /* --- Main Content Area --- */
        #main-area { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        #content-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #placeholder { color: var(--text-muted); text-align: center; }
        #content-frame { width: 100%; height: 100%; border: none; display: none; background: #000; }
        
        .ui-hints { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px; font-size: 0.75rem; color: var(--text-muted); text-align: right; pointer-events: none; }

        /* --- GitHub Modal --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; opacity: 0; transition: opacity var(--transition-speed); }
        .modal-overlay.visible { display: flex; opacity: 1; }
        .modal-content { background: var(--bg-sidebar); width: 90%; max-width: 500px; max-height: 80%; border: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform var(--transition-speed); }
        .modal-overlay.visible .modal-content { transform: translateY(0); }
        .modal-content h2 { margin: 0 0 15px 0; color: var(--accent); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #484b4e; background: #161718; color: white; box-sizing: border-box; outline: none; transition: border 0.2s; }
        .form-group input:focus { border-color: var(--accent); }
        #gh-sync-status { font-size: 0.85rem; color: var(--accent); margin-top: 10px; text-align: center; min-height: 20px; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- LAYER 1: DECOY UI -->
    <div id="decoy-ui">
        <div id="decoy-header">Algebra I - Chapter 4 Notes</div>
        <textarea id="decoy-textarea" placeholder="Start typing equations... (Ex: 2x + 4 = 12)" spellcheck="false"></textarea>
    </div>

    <!-- LAYER 2: THE REAL APP -->
    <div id="real-ui">
        <!-- Boss Key Layer -->
        <div id="boss-layer">
            <div id="boss-top-nav"><a href="#">Gmail</a> <a href="#">Images</a> <a href="#" style="font-size: 18px;">⋮</a> <div class="profile-pic">U</div></div>
            <div class="google-logo"><span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span></div>

        <div id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row"><h2>System Core</h2></div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-green" onclick="toggleFullscreen()" style="flex:1; padding:9px 5px;">⛶ Fullscreen</button>

                <div id="upload-status"></div>
                
                <div class="upload-btn-wrapper"><button class="btn">📁 Import Directory</button><input type="file" id="dir-upload" webkitdirectory directory multiple /></div>

                <!-- Native AllowFullscreen flags added to prevent scale crushing -->
                <iframe id="content-frame" allow="cross-origin-isolated; autoplay; pointer-lock; keyboard; fullscreen; gamepad; display-capture" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>

            </div>

    </div>

    <!-- GitHub Sync Modal -->
    <div id="github-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>🐙 Sync Cloud Repo</h2>
                <button class="btn btn-secondary" style="width:auto; margin:0; padding: 4px 10px;" onclick="closeModal('github-modal')">✕</button>
            </div>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0;">Pull environments directly from a public repository.</p>
            
            <div class="form-group">
                <label>Repository</label>
                <input type="text" id="gh-repo-input" value="YourFavoriteTeacherDan/StudyingTool" placeholder="username/repo" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Branch (default: main)</label>
                <input type="text" id="gh-branch-input" placeholder="main" value="main" autocomplete="off">
            </div>
            
            <button class="btn" onclick="syncGitHubRepo()" id="gh-sync-btn">⬇️ Start Sync</button>
            <div id="gh-sync-status"></div>
        </div>
    </div>

    <script>
        // --- 1. ANTI-INSPECTION & STEALTH LOGIC ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) e.preventDefault();
        });

        // Tab Blur Disguise
        document.addEventListener("visibilitychange", () => {
            const title = document.getElementById('page-title');
            const icon = document.getElementById('page-icon');
            if (document.hidden) {
                title.innerText = "Untitled document - Google Docs";
                icon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%234285F4'/><rect x='20' y='20' width='60' height='10' fill='white'/><rect x='20' y='40' width='60' height='10' fill='white'/><rect x='20' y='60' width='40' height='10' fill='white'/></svg>";
            } else {
                title.innerText = "Algebra Notes";
                icon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='black'>√</text></svg>";
            }
        });

        // --- 2. GHOST TRIGGER (THE LOCK) ---
        let keyBuffer = "";
        const triggerWord = "gulo"; 
        
        window.addEventListener("keydown", (e) => {
            let isTyping = (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);
            
            if (e.key === '`' || e.key === '~') {
                const boss = document.getElementById('boss-layer');
                boss.style.display = boss.style.display === 'flex' ? 'none' : 'flex';
                return;
            }

            if (e.key.length === 1 && !isTyping) {
                keyBuffer += e.key.toLowerCase();
                if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);
                
                // Unlock Decoy UI -> Real UI
                if (keyBuffer.includes(triggerWord) && document.getElementById('decoy-ui').style.display !== 'none') {
                    document.getElementById('decoy-ui').style.display = 'none';
                    document.getElementById('real-ui').style.display = 'flex';
                    keyBuffer = ""; 
                    return;
                }

                // If Already Unlocked, open Payload Launcher
                if (keyBuffer.includes(triggerWord) && document.getElementById('real-ui').style.display === 'flex') {
                    keyBuffer = "";
                    setTimeout(() => {
                        let enc = prompt("Enter sequence:");
                        if (enc) performDecryption(enc);
                    }, 50);
                }
            }

            // Real UI Hotkeys
            if (document.getElementById('real-ui').style.display === 'flex' && !isTyping) {
                if (e.key.toLowerCase() === 'j') {
                    const sb = document.getElementById('sidebar');
                    sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
                }
                if (e.altKey && e.key.toLowerCase() === 'w') {
                    if(confirm("EMERGENCY: Wipe all data?")) {
                        indexedDB.deleteDatabase("StudyEnvDB");
                        location.reload();
                    }
                }
            }
        });

        // --- 3. PAYLOAD EXECUTOR ---
        const SECRET_KEY = "gulo";

        function xorEngine(input, key) {
            let output = '';
            for (let i = 0; i < input.length; i++) output += String.fromCharCode(input.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            return output;
        }

        function performDecryption(payload) {
            try {
                let decrypted = xorEngine(atob(payload), SECRET_KEY).trim();
                let isHTML = decrypted.startsWith('<');
                
                let win = window.open('about:blank', '_blank');
                if(!win) { alert("Popup blocked! Please allow popups for this site."); return; }

                if (isHTML) {
                    win.document.write(decrypted);
                } else {
                    let url = decrypted;
                    if (!url.startsWith('http') && !url.startsWith('//') && !url.startsWith('data:')) url = 'https://' + url;
                    
                    win.document.write(`
                        <!DOCTYPE html><html><head><title>Desmos | Graphing Calculator</title>
                        <link rel="icon" href="https://www.desmos.com/favicon.ico">
                        <style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}iframe{width:100vw;height:100vh;border:none;display:block;}</style>
                        </head><body><iframe src="${url}" allow="fullscreen; autoplay; gamepad; pointer-lock"></iframe></body></html>
                    `);
                }
                win.document.close();
                window.location.replace("https://www.khanacademy.org/"); 
                
            } catch (err) { alert("Decryption failed. Invalid sequence."); }
        }

        // --- 4. VIRTUAL FILE SYSTEM & GITHUB SYNC ---
        let _db=null; const _dN="StudyEnvDB", _fS="virtual_files";
        const _cF=document.getElementById('content-frame'), _pH=document.getElementById('placeholder');
        const _fT=document.getElementById('file-tree'), _sT=document.getElementById('upload-status');
        let _activeTurboHTML = ""; 

        const _req=indexedDB.open(_dN, 3);
        _req.onupgradeneeded=e=>{ _db=e.target.result; if(!_db.objectStoreNames.contains(_fS)) _db.createObjectStore(_fS,{keyPath:"path"}); };
        _req.onsuccess=e=>{ _db=e.target.result; _rFT(); };

        document.getElementById('file-upload').addEventListener('change',e=>_hU(e.target.files,false));
        document.getElementById('dir-upload').addEventListener('change',e=>_hU(e.target.files,true));

        function openModal(id) { const m = document.getElementById(id); m.style.display = 'flex'; setTimeout(() => m.classList.add('visible'), 10); }
        function closeModal(id) { const m = document.getElementById(id); m.classList.remove('visible'); setTimeout(() => m.style.display = 'none', 200); }

        async function syncGitHubRepo() {
            if (!_db) return;
            const repoInput = document.getElementById('gh-repo-input').value.trim();
            const branchInput = document.getElementById('gh-branch-input').value.trim() || 'main';
            const statusBox = document.getElementById('gh-sync-status');
            const btn = document.getElementById('gh-sync-btn');
            
            if (!repoInput.includes('/')) { statusBox.textContent = "Error: Use 'username/repository'."; statusBox.style.color = "var(--danger)"; return; }

            btn.disabled = true; btn.style.opacity = '0.5';
            statusBox.style.color = "var(--accent)"; statusBox.textContent = "Fetching repository tree...";

            try {
                const apiURL = `https://api.github.com/repos/${repoInput}/git/trees/${branchInput}?recursive=1`;
                const treeRes = await fetch(apiURL);
                if (!treeRes.ok) throw new Error("Repository not found or API rate limited.");
                
                const treeData = await treeRes.json();
                const files = treeData.tree.filter(f => f.type === 'blob');
                if (files.length === 0) throw new Error("No files found in this branch.");

                let downloaded = 0; const batchSize = 10;
                for (let i = 0; i < files.length; i += batchSize) {
                    const batch = files.slice(i, i + batchSize);
                    await Promise.all(batch.map(async (file) => {
                        const rawUrl = `https://raw.githubusercontent.com/${repoInput}/${branchInput}/${file.path}`;
                        try {
                            const fileRes = await fetch(rawUrl);
                            if (fileRes.ok) {
                                const blob = await fileRes.blob();
                                await new Promise(resolve => {
                                    const tx = _db.transaction([_fS], "readwrite");
                                    tx.objectStore(_fS).put({ path: `${repoInput.split('/')[1]}/${file.path}`, name: file.path.split('/').pop(), blob: blob });
                                    tx.oncomplete = resolve;
                                });
                            }
                        } catch(e) {}
                        downloaded++; statusBox.textContent = `Downloading ${downloaded} / ${files.length} ...`;
                    }));
                }
                statusBox.style.color = "var(--success)"; statusBox.textContent = `Successfully synced ${downloaded} files!`;
                _rFT();
                setTimeout(() => { closeModal('github-modal'); statusBox.textContent = ''; btn.disabled = false; btn.style.opacity = '1'; }, 1500);
            } catch (err) {
                statusBox.style.color = "var(--danger)"; statusBox.textContent = err.message;
                btn.disabled = false; btn.style.opacity = '1';
            }
        }

        function _hU(f,isD){
            if(!_db||f.length===0)return;
            let c=0, t=f.length, b=50;
            function _p(){
                const tx=_db.transaction([_fS],"readwrite"), st=tx.objectStore(_fS);
                let end=Math.min(c+b,t);
                for(let i=c; i<end; i++){
                    let p=(isD&&f[i].webkitRelativePath)?f[i].webkitRelativePath:f[i].name;
                    if(!p.includes('.DS_Store')) st.put({path:p, name:f[i].name, blob:new Blob([f[i]],{type:f[i].type})});
                }
                tx.oncomplete=()=>{ c=end; _sT.textContent=`Cached ${c}/${t}`; if(c<t) requestAnimationFrame(_p); else{ setTimeout(()=>_sT.textContent="",2000); _rFT(); } };
            }
            _p();
        }

        function _rFT(){
            _fT.innerHTML=""; if(!_db)return;
            _db.transaction([_fS],"readonly").objectStore(_fS).getAll().onsuccess=e=>{
                const aF=e.target.result, lF=aF.filter(f=>f.name.endsWith('.html')||f.name.endsWith('.htm'));
                if(lF.length===0)return;
                let fd={}; lF.forEach(f=>{ let p=f.path.split('/'), n=p.length>1?p[0]:"Root"; if(!fd[n])fd[n]=[]; fd[n].push(f); });
                Object.keys(fd).sort().forEach(n=>{
                    let d=document.createElement('div'); d.className='folder-group';
                    d.innerHTML=`<div class="folder-title">${n}</div><div class="fc"></div>`;
                    fd[n].forEach(f=>{
                        let li=document.createElement('li'); li.className='file-item';
                        li.innerHTML=`<span>📄 ${f.name}</span><button class="action-btns delete-btn">✕</button>`;
                        li.onclick=(ev)=>{
                            if(ev.target.tagName==='BUTTON'){ _db.transaction([_fS],"readwrite").objectStore(_fS).delete(f.path).oncomplete=_rFT; return; }
                            _lVC(f.path,aF);
                        };
                        d.querySelector('.fc').appendChild(li);
                    });
                    _fT.appendChild(d);
                });
            };
        }

        function _lVC(eP, aF){
            _pH.style.display='none'; _cF.style.display='block';
            const vFS={}; aF.forEach(f=>{ vFS[f.path]=URL.createObjectURL(f.blob); });
            const r=new FileReader();
            r.onload=function(e){
                let hc=e.target.result, d=eP.includes('/')?eP.substring(0,eP.lastIndexOf('/')):'';
                for(const [rP,bU] of Object.entries(vFS)){
                    let rT=rP; if(d&&rP.startsWith(d+'/')) rT=rP.substring(d.length+1);
                    hc=hc.replace(new RegExp(`(["'])(./)?${rT.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&')}(["'])`,'g'),`$1${bU}$3`);
                }
                
                _activeTurboHTML = hc; 
                document.getElementById('turbo-btn').style.display = 'flex';
                
                _cF.src=URL.createObjectURL(new Blob([hc],{type:'text/html'}));
                _cF.onload=()=>_cF.focus();
            };
            r.readAsText(aF.find(f=>f.path===eP).blob);
        }

        function toggleFullscreen() { 
            const cw = document.getElementById('content-wrapper');
            if(!document.fullscreenElement) cw.requestFullscreen(); else document.exitFullscreen(); 
        }

        function launchTurbo() {
            if(!_activeTurboHTML) return;
            let w = window.open('about:blank', '_blank');
            if(w) {
                w.document.write(_activeTurboHTML);
                w.document.close();
            } else {
                alert("Pop-ups must be allowed to launch Turbo Mode.");
            }
        }
    </script>
</body>
</html>
